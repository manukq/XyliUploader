<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <title>Album - XyliUploader</title>
    <style>
        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .album-item {
            background: #151515;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s;
        }
        .album-item:hover {
            transform: translateY(-4px);
        }
        .album-item img,
        .album-item video {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }
        .album-item .file-preview {
            width: 100%;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
            color: #555;
        }
        .album-item-info {
            padding: 12px;
        }
        .album-item-name {
            font-size: 13px;
            font-weight: 500;
            color: #e0e0e0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .album-item-size {
            font-size: 11px;
            color: #666;
            margin-top: 4px;
        }
        .album-item-link {
            display: block;
            padding: 8px 12px;
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: #fff;
            background: #2a2a2a;
            text-decoration: none;
            transition: background 0.2s;
        }
        .album-item-link:hover {
            background: #3a3a3a;
        }
        .album-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .album-title {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
        }
        .album-count {
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="album-header">
            <a href="/" class="back-link">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Назад
            </a>
            <h1 class="album-title">Album</h1>
            <span class="album-count">{{len .Files}} files</span>
        </div>

        <div class="album-grid">
            {{range .Files}}
            <div class="album-item">
                {{if eq .Type "image"}}
                <a href="/{{.ID}}" target="_blank">
                    <img src="/raw/{{.ID}}" alt="{{.Filename}}" loading="lazy">
                </a>
                {{else if eq .Type "video"}}
                <a href="/{{.ID}}" target="_blank">
                    <video src="/raw/{{.ID}}" preload="metadata" muted></video>
                </a>
                {{else if eq .Type "audio"}}
                <a href="/{{.ID}}" target="_blank">
                    <div class="file-preview">
                        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M9 18V5l12-2v13"/>
                            <circle cx="6" cy="18" r="3"/>
                            <circle cx="18" cy="16" r="3"/>
                        </svg>
                    </div>
                </a>
                {{else}}
                <a href="/{{.ID}}" target="_blank">
                    <div class="file-preview">
                        <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                    </div>
                </a>
                {{end}}
                <div class="album-item-info">
                    <div class="album-item-name" title="{{.Filename}}">{{.Filename}}</div>
                    <div class="album-item-size">{{.Size}}</div>
                </div>
                <a href="/{{.ID}}" target="_blank" class="album-item-link">Open</a>
            </div>
            {{end}}
        </div>
    </div>
</body>
</html>
