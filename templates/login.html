<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <title>Login - XyliUploader</title>
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="/" class="back-link">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
                Назад
            </a>
            <h1 class="title">Вход</h1>
        </header>

        <div class="login-section">
            <a href="/auth/login/discord" class="oauth-btn discord">
                <img src="https://cdn.simpleicons.org/discord/5865F2" alt="Discord" class="oauth-icon">
                <span>Discord</span>
            </a>
            <a href="/auth/login/twitch" class="oauth-btn twitch">
                <img src="https://cdn.simpleicons.org/twitch/9146FF" alt="Twitch" class="oauth-icon">
                <span>Twitch</span>
            </a>
            <a href="/auth/login/github" class="oauth-btn github">
                <img src="https://cdn.simpleicons.org/github/181717" alt="GitHub" class="oauth-icon">
                <span>GitHub</span>
            </a>
        </div>
    </div>
</body>
</html>
